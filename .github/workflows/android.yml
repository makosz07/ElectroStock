name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o electrostock_android.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show files
        run: |
          ls -la
          ls -la electrostock_android

      - name: Build APK
        working-directory: electrostock_android
        run: gradle assembleDebug --stacktrace

            - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: electrostock-apk
          path: electrostock_android/app/build/outputs/apk/debug/*.apk
