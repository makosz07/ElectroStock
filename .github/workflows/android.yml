name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o electrostock_android.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # KROK NAPRAWCZY: Generujemy brakujący plik gradle-wrapper.jar
      - name: Fix missing Gradle Wrapper jar
        working-directory: electrostock_android
        run: jar cMf gradle/wrapper/gradle-wrapper.jar -C . . || gradle wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x electrostock_android/gradlew

      - name: Build APK
        working-directory: electrostock_android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: electrostock-apk
          path: electrostock_android/app/build/outputs/apk/debug/*.apk
