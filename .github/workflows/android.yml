name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o electrostock_offline.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Budujemy aplikację, wskazując nowy, poprawny folder roboczy
      - name: Build APK
        working-directory: electrostock_premium
        run: gradle assembleDebug --stacktrace

      # Pobieramy gotowy plik APK z nowego folderu
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: electrostock-apk
          path: electrostock_premium/app/build/outputs/apk/debug/*.apk
